<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glivva Car Rentals — Coming Soon</title>
  <meta name="description" content="Glivva Car Rentals website is currently under development. We will be live soon.">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#07111f 0%,#0d1f35 55%,#132d49 100%);
      color:#fff;padding:24px;overflow:hidden;position:relative
    }
    body:before,body:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.18}
    body:before{width:420px;height:420px;background:#39d98a;top:-170px;right:-130px}
    body:after{width:360px;height:360px;background:#4aa3ff;bottom:-180px;left:-120px}
    .card{
      width:min(760px,100%);position:relative;z-index:1;text-align:center;
      padding:56px 34px;border:1px solid rgba(255,255,255,.13);
      background:rgba(255,255,255,.07);backdrop-filter:blur(18px);
      border-radius:28px;box-shadow:0 25px 80px rgba(0,0,0,.35)
    }
    .logo{
      width:76px;height:76px;margin:0 auto 24px;border-radius:22px;
      display:grid;place-items:center;background:#fff;color:#0b1d30;
      font-size:28px;font-weight:900;letter-spacing:-2px
    }
    .badge{
      display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;
      background:rgba(57,217,138,.13);border:1px solid rgba(57,217,138,.28);
      color:#7ff0b5;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px
    }
    h1{font-size:clamp(38px,7vw,68px);line-height:1.02;letter-spacing:-3px;margin:22px 0 16px}
    h1 span{color:#65e6a5}
    p{max-width:590px;margin:0 auto;color:#c9d5e3;font-size:18px;line-height:1.7}
    .line{width:90px;height:4px;border-radius:4px;background:#65e6a5;margin:30px auto}
    .footer{margin-top:32px;color:#8fa2b7;font-size:14px}
    .footer strong{color:#dce8f4}
    @media(max-width:520px){.card{padding:42px 22px;border-radius:22px}h1{letter-spacing:-2px}p{font-size:16px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">GC</div>
    <div class="badge">● Website under development</div>
    <h1>Glivva <span>Car Rentals</span></h1>
    <p>
      We're working on a better way to make your car rental experience
      simple, reliable and convenient. Our new website is coming soon.
    </p>
    <div class="line"></div>
    <p style="font-size:15px">Thank you for your patience. We'll be on the road soon.</p>
    <div class="footer">© 2026 <strong>Glivva Car Rentals</strong>. All rights reserved.</div>
  </main>
</body>
</html>
